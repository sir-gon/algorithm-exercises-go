---

services:
  algorithm-exercises-go-test:
    image: algorithm-exercises-go:test
    build:
      context: .
      target: testing
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO} ## (1) ## INFO | WARN | ERROR | DEBUG
      BRUTEFORCE: ${BRUTEFORCE:-false} ## (1) ## TRUE | FALSE
    volumes:
      - ./coverage:/app/coverage
    profiles: ["testing"]

  algorithm-exercises-go-lint:
    image: algorithm-exercises-go:lint
    build:
      context: .
      target: lint
    volumes:
      - ./:/app
    profiles: ["lint"]

  markdownlint:
    image: goncl/markdownlint-cli:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
    profiles: ["lint"]

  yamllint:
    image: goncl/yamllint:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
    profiles: ["lint"]

  algorithm-exercises-go-dev:
    image: algorithm-exercises-go:dev
    build:
      context: .
      target: development
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO} ## (1) ## INFO | WARN | ERROR | DEBUG
      BRUTEFORCE: ${BRUTEFORCE:-false} ## (1) ## TRUE | FALSE
    volumes:
      - ./:/app
    profiles: ["development"]

  algorithm-exercises-go:
    image: algorithm-exercises-go:latest
    build:
      context: .
      target: production
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO} ## (1) ## INFO | WARN | ERROR | DEBUG
      BRUTEFORCE: ${BRUTEFORCE:-false} ## (1) ## TRUE | FALSE
    # volumes:
    #   - ./:/app
    profiles: ["production"]
